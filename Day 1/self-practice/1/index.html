<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Functions</title>
</head>
<body>
    <h1 style="text-align: center;">A Simple Function Calculator</h1>
    <form id="calculator" style="text-align: center;">
        <label for="num">Enter your number:</label>
        <input type="number" id="num" required>
        <br><br>
        <button type="button" onclick="calculatefact()">Calculate Factorial</button>
        <p id="result" style="margin-top: 20px;"></p>
    </form>
    <script>
        function calculatefact() {
            const num = document.getElementById('num').value;
            let result = 1;

            if (num < 0) {
                document.getElementById('result').innerText = "Factorial is not defined for negative numbers.";
                return;
            }

            for (let i = 1; i <= num; i++) {
                result *= i;
            }
            document.getElementById('result').innerText = `The factorial of ${num} is ${result}.`;

            
        }
    </script>

</body>
</html>


<!-- plaindrome -->

<!DOCTYPE html>
<html>
<head>
  <title>Palindrome Checker</title>
</head>
<body>
  <h1>Palindrome Checker</h1>

  <input type="text" id="textInput" placeholder="Enter a word">
  <button onclick="checkPalindrome()">Check</button>

  <p id="result"></p>

  <script>
    function checkPalindrome() {
      const word = document.getElementById('textInput').value;
      const reversed = word.split('').reverse().join('');

      if (word === reversed) {
        document.getElementById('result').innerText = `${word} is a palindrome.`;
      } else {
        document.getElementById('result').innerText = `${word} is not a palindrome.`;
      }
    }
  </script>
</body>
</html>

<!-- largest number finder  -->


<!DOCTYPE html>
<html>
<head>
  <title>Largest Number Finder</title>
</head>
<body>
  <h1>Find Largest Number</h1>

  <input type="text" id="numbers" placeholder="Enter numbers separated by commas">
  <button onclick="findLargest()">Find Largest</button>

  <p id="result"></p>

  <script>
    function findLargest() {
      const input = document.getElementById('numbers').value;
      const numArray = input.split(','); // split by comma
      let largest = Number(numArray[0]); // assume first number is largest

      for (let i = 1; i < numArray.length; i++) {
        let current = Number(numArray[i]);
        if (current > largest) {
          largest = current;
        }
      }

      document.getElementById('result').innerText = "The largest number is " + largest;
    }
  </script>
</body>
</html>
