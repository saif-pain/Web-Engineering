<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Functions</title>
</head>
<body>
    <h1 style="text-align: center;">A Simple Function Calculator</h1>
    <form id="calculator" style="text-align: center;">
        <label for="num">Enter your number:</label>
        <input type="number" id="num" required>
        <br><br>
        <button type="button" onclick="calculatefact()">Calculate Factorial</button>
        <p id="result" style="margin-top: 20px;"></p>
    </form>
    <script>
        function calculatefact() {
            const num = document.getElementById('num').value;
            let result = 1;

            if (num < 0) {
                document.getElementById('result').innerText = "Factorial is not defined for negative numbers.";
                return;
            }

            for (let i = 1; i <= num; i++) {
                result *= i;
            }
            document.getElementById('result').innerText = `The factorial of ${num} is ${result}.`;

            
        }
    </script>

</body>
</html>
